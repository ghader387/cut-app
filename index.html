<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CutMaster Pro | نسخه میلی‌متری</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; margin: 0; padding: 0; }
        
        body { height: 100vh; background-color: #121212; overflow: hidden; display: flex; flex-direction: column; color: #fff; }
        
        .header { background: #1e1e24; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10; }
        .header h1 { font-size: 16px; color: #00d2ff; }
        
        .tabs { display: flex; background: #1e1e24; border-bottom: 1px solid #333; z-index: 10; overflow-x: auto;}
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 12px; font-weight: bold; color: #888; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.3s; white-space: nowrap;}
        .tab.active { color: #00d2ff; border-bottom-color: #00d2ff; background: #25252d; }

        .content-area { flex-grow: 1; position: relative; overflow: hidden; background: #121212; }
        .tab-content { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; overflow-y: auto;}
        .tab-content.active { display: block; }

        #canvas-container { width: 100%; height: 100%; display: block; background: radial-gradient(circle, #2a2a35 0%, #121212 100%); }
        .dimension-label { color: #fff; font-size: 12px; background: rgba(0,210,255,0.8); padding: 2px 6px; border-radius: 4px; transform: translate(-50%, -50%); pointer-events: none; }

        .table-container { padding: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th, td { border: 1px solid #333; padding: 10px; }
        th { background: #25252d; color: #00d2ff; position: sticky; top: 0; }
        tr:nth-child(even) { background: #1a1a1f; }

        #nesting-canvas { width: 100%; height: 100%; display: block; background: #1a1a1f; }

        .controls-panel { background: #1e1e24; padding: 15px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .inputs-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 60px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: #aaa; text-align: center; }
        .input-group input, .input-group select { padding: 8px; border: 1px solid #444; border-radius: 6px; text-align: center; font-size: 14px; color: #fff; background: #2a2a35; outline: none; }
        .input-group input:focus { border-color: #00d2ff; }
        
        .btn-main { background: #00d2ff; color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); }

        .finance-card { background: #1e1e24; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .finance-card h3 { font-size: 14px; color: #00d2ff; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .price-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;}
        .total-cost { font-size: 18px; color: #27ae60; text-align: center; padding: 15px; background: rgba(39, 174, 96, 0.1); border: 1px solid #27ae60; border-radius: 8px; margin-top: 10px;}
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #333; font-size: 13px;}
        .stat-row span:last-child { font-weight: bold; color: #e94560; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ CutMaster Pro (mm)</h1>
        <button onclick="toggleDim()" id="dimBtn" style="background:#444; color:#fff; border:none; padding:6px 10px; border-radius:5px; font-size:11px;">ابعاد: روشن</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('3d', event)">📦 سه‌بعدی</div>
        <div class="tab" onclick="switchTab('list', event)">📋 لیست برش</div>
        <div class="tab" onclick="switchTab('nesting', event)">🗂️ چیدمان ورق</div>
        <div class="tab" onclick="switchTab('finance', event)">💰 یراق و هزینه</div>
    </div>

    <div class="content-area">
        <div id="tab-3d" class="tab-content active"><div id="canvas-container"></div></div>
        
        <div id="tab-list" class="tab-content">
            <div class="table-container">
                <table><thead><tr><th>نام قطعه</th><th>طول (mm)</th><th>عرض (mm)</th><th>تعداد</th></tr></thead><tbody id="cut-list-body"></tbody></table>
            </div>
        </div>
        
        <div id="tab-nesting" class="tab-content">
            <canvas id="nesting-canvas"></canvas>
            <div id="nesting-info" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; font-size: 12px; border: 1px solid #444; z-index: 20;">در حال محاسبه...</div>
        </div>
        
        <div id="tab-finance" class="tab-content">
            <div style="padding: 15px;">
                <div class="finance-card">
                    <h3>📊 لیست یراق‌آلات</h3>
                    <div class="stat-row"><span>تعداد لولا:</span> <span id="stat-hinges">0</span></div>
                    <div class="stat-row"><span>تعداد ریل کشو:</span> <span id="stat-slides">0</span></div>
                    <div class="stat-row"><span>تعداد دستگیره:</span> <span id="stat-handles">0</span></div>
                    <div class="stat-row"><span>متراژ نوار لبه:</span> <span id="stat-edge">0</span></div>
                    <div class="stat-row"><span>تعداد ورق مصرفی:</span> <span id="stat-sheets">0</span></div>
                </div>
                <div class="finance-card">
                    <h3>💵 قیمت‌گذاری (تومان)</h3>
                    <div class="price-inputs">
                        <div class="input-group"><label>قیمت ورق MDF</label><input type="number" id="priceMdf" value="2500000" onchange="updateFinance()"></div>
                        <div class="input-group"><label>قیمت متر PVC</label><input type="number" id="pricePvc" value="50000" onchange="updateFinance()"></div>
                        <div class="input-group"><label>قیمت لولا</label><input type="number" id="priceHinge" value="15000" onchange="updateFinance()"></div>
                        <div class="input-group"><label>قیمت جفت ریل</label><input type="number" id="priceSlide" value="120000" onchange="updateFinance()"></div>
                        <div class="input-group"><label>قیمت دستگیره</label><input type="number" id="priceHandle" value="80000" onchange="updateFinance()"></div>
                    </div>
                    <div class="total-cost">هزینه تمام‌شده:<br><span id="total-cost-value">0</span> تومان</div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="inputs-row">
            <div class="input-group" style="flex: 1.5;">
                <label>نوع کابینت</label>
                <select id="cabinetType" onchange="changeCabinetType()">
                    <option value="base-double">زمینی ۲ درب</option>
                    <option value="base-single">زمینی ۱ درب</option>
                    <option value="wall-double">هوایی ۲ درب</option>
                    <option value="wall-single">هوایی ۱ درب</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>چیدمان</label>
                <select id="drawerCount" onchange="generateAll()">
                    <option value="0">بدون کشو (درب‌دار)</option>
                    <option value="3" selected>۳ کشو</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>ضخامت صفحه</label>
                <select id="countertopThickness">
                    <option value="30">۳۰ میلی‌متر</option>
                    <option value="50" selected>۵۰ میلی‌متر</option>
                </select>
            </div>
        </div>
        <div class="inputs-row">
            <div class="input-group"><label>عرض (mm)</label><input type="number" id="width" value="600" min="100"></div>
            <div class="input-group"><label>ارتفاع (mm)</label><input type="number" id="height" value="850" min="100"></div>
            <div class="input-group"><label>عمق (mm)</label><input type="number" id="depth" value="550" min="100"></div>
            <div class="input-group"><label>ضخامت بدنه (mm)</label><input type="number" id="thickness" value="16" step="1" min="10"></div>
        </div>
        <button class="btn-main" onclick="generateAll()">🔄 محاسبه و بروزرسانی</button>
    </div>

    <script>
        let globalCutList = [];
        let globalHardware = {};
        let globalSheetsCount = 0;
        let showDims = true;
        let scene, camera, renderer, labelRenderer, controls, cabinetGroup, dimensionGroup;

        // ==========================================
        // ۱. توابع کمکی و تغییر نوع
        // ==========================================
        function changeCabinetType() {
            const type = document.getElementById('cabinetType').value;
            if (type.includes('wall')) {
                document.getElementById('depth').value = 300; // عمق هوایی 30 سانتی متر
                document.getElementById('height').value = 700;
            } else {
                document.getElementById('depth').value = 550; // عمق زمینی 55 سانتی متر
                document.getElementById('height').value = 850;
            }
            generateAll();
        }

        // ==========================================
        // ۲. محاسبات (کاملا میلی‌متری)
        // ==========================================
        function calculateCutList(w, h, d, t, drawerCount, type) {
            let list = [];
            let isWall = type.includes('wall');
            let isSingle = type.includes('single');
            
            let toeKickH = isWall ? 0 : 100; // پاخور 100 میلی‌متر
            let bodyH = h - toeKickH; 

            // بدنه و سازه
            list.push({ name: "بدنه (چپ/راست)", L: bodyH, W: d, Q: 2, type: 'wood' });
            let innerWidth = w - (t * 2);
            list.push({ name: "کف و سقف", L: innerWidth, W: d, Q: 2, type: 'wood' });
            let backH = bodyH - (t * 2) - 2; // 2 میلی‌متر فضای آزاد
            list.push({ name: "فیبر پشت", L: backH, W: w - (t * 2), Q: 1, type: 'fiber' });
            
            if (!isWall) {
                list.push({ name: "پاخور (Toe Kick)", L: innerWidth, W: 100, Q: 1, type: 'wood' });
                // صفحه کابینت: عرض + 20 (هر طرف 10)، عمق + 50 (بیرون زدگی جلو)
                list.push({ name: "صفحه رویی", L: w + 20, W: d + 50, Q: 1, type: 'countertop' });
            }

            // درب و کشو
            if (drawerCount === 0) {
                list.push({ name: "طبقه", L: innerWidth - 2, W: d - 20, Q: 2, type: 'wood' });
                let doorW = isSingle ? (w - 3) : ((w / 2) - 1.5); // درز 3 میلی‌متر
                let doorH = bodyH - 3;
                let doorQty = isSingle ? 1 : 2;
                list.push({ name: "درب", L: doorH, W: doorW, Q: doorQty, type: 'wood' });
            } else {
                let clearance = 13; // فضای ریل 13 میلی‌متر
                let boxWidth = innerWidth - (clearance * 2);
                let boxDepth = d - 20; 
                let gap = 3; // درز 3 میلی‌متر
                let frontH = (bodyH - ((drawerCount + 1) * gap)) / drawerCount;

                for (let i = 1; i <= drawerCount; i++) {
                    list.push({ name: `پنل کشو ${i}`, L: frontH, W: w, Q: 1, type: 'wood' });
                }
                let boxH = frontH - 20; 
                list.push({ name: "بدنه کشو طولی", L: boxDepth, W: boxH, Q: 2 * drawerCount, type: 'wood' });
                list.push({ name: "بدنه کشو عرضی", L: boxWidth - (t*2), W: boxH, Q: 2 * drawerCount, type: 'wood' });
                list.push({ name: "کف کشو", L: boxWidth - 10, W: boxDepth - 10, Q: drawerCount, type: 'fiber' });
            }
            return list;
        }

        function calculateHardware(drawerCount, type) {
            let isSingle = type.includes('single');
            let hinges = (drawerCount === 0) ? (isSingle ? 2 : 4) : 0;
            let handles = (drawerCount === 0) ? (isSingle ? 1 : 2) : drawerCount;
            let edgeMeters = 0;
            globalCutList.forEach(item => {
                if(item.type === 'wood') {
                    if(item.name.includes("درب") || item.name.includes("پنل کشو")) {
                        edgeMeters += ((item.L + item.W) * 2 / 1000) * item.Q; // تبدیل میلی‌متر به متر
                    } else {
                        edgeMeters += (item.L / 1000) * item.Q; 
                    }
                }
            });
            return { hinges, slides: drawerCount, handles, edgeMeters: edgeMeters.toFixed(1) };
        }

        // ==========================================
        // ۳. موتور سه بعدی
        // ==========================================
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            // دوربین باید دورتر باشد چون ابعاد میلی‌متری است
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 10000);
            camera.position.set(1500, 1200, 1800);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            
            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.domElement.style.position = 'absolute'; labelRenderer.domElement.style.top = '0px'; labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(1000, 2000, 1000); scene.add(dirLight);
            
            cabinetGroup = new THREE.Group(); scene.add(cabinetGroup);
            dimensionGroup = new THREE.Group(); scene.add(dimensionGroup);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.maxPolarAngle = Math.PI / 2;
            
            animate();
        }

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera); }

        function createDimLine(p1, p2, text) {
            const mat = new THREE.LineBasicMaterial({ color: 0x00d2ff });
            const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p1.x, p1.y, p1.z), new THREE.Vector3(p2.x, p2.y, p2.z)]);
            dimensionGroup.add(new THREE.Line(geo, mat));
            const div = document.createElement('div'); div.className = 'dimension-label'; div.textContent = text;
            const label = new THREE.CSS2DObject(div); label.position.set((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, (p1.z + p2.z) / 2);
            dimensionGroup.add(label);
        }

        function buildDimensions(w, h, d) {
            while(dimensionGroup.children.length > 0){ dimensionGroup.remove(dimensionGroup.children[0]); }
            if (!showDims) return;
            const offset = 200; // فاصله خطوط ابعاد
            createDimLine({x: -w/2, y: -h/2 - offset, z: d/2}, {x: w/2, y: -h/2 - offset, z: d/2}, `${w} mm`);
            createDimLine({x: -w/2 - offset, y: -h/2, z: d/2}, {x: -w/2 - offset, y: h/2, z: d/2}, `${h} mm`);
            createDimLine({x: w/2 + offset, y: -h/2, z: -d/2}, {x: w/2 + offset, y: -h/2, z: d/2}, `${d} mm`);
        }

        function toggleDim() { showDims = !showDims; document.getElementById('dimBtn').textContent = showDims ? "ابعاد: روشن" : "ابعاد: خاموش"; generateAll(); }

        function build3DCabinet(w, h, d, t, drawerCount, type) {
            while(cabinetGroup.children.length > 0){ cabinetGroup.remove(cabinetGroup.children[0]); }
            const isWall = type.includes('wall');
            const isSingle = type.includes('single');
            const countertopT = parseFloat(document.getElementById('countertopThickness').value);

            const matBody = new THREE.MeshStandardMaterial({ color: 0xdeb887, roughness: 0.9 }); 
            const matFront = new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 0.5 }); 
            const matCounter = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.2 }); 
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });

            function createPanel(pw, ph, pd, px, py, pz, material) {
                const geo = new THREE.BoxGeometry(pw, ph, pd);
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.set(px, py, pz); mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
                cabinetGroup.add(mesh); return mesh;
            }

            let toeKickH = isWall ? 0 : 100; let bodyH = h - toeKickH; 
            const halfW = w / 2; const halfD = d / 2;
            const yOffset = -h/2 + toeKickH + (bodyH/2);
            const startY = yOffset - (bodyH/2); const endY = yOffset + (bodyH/2);

            // بدنه ها
            createPanel(t, bodyH, d, -halfW + (t/2), yOffset, 0, matBody);
            createPanel(t, bodyH, d, halfW - (t/2), yOffset, 0, matBody);
            const innerW = w - (t * 2);
            createPanel(innerW, t, d, 0, startY + (t/2), 0, matBody);
            createPanel(innerW, t, d, 0, endY - (t/2), 0, matBody);
            createPanel(innerW, bodyH - (t*2), t, 0, yOffset, -halfD + (t/2), matBody);
            
            if (!isWall) {
                createPanel(innerW, toeKickH, 20, 0, -h/2 + (toeKickH/2), -halfD + 20 + (t/2), matBody);
                // صفحه رویی با ضخامت انتخابی (30 یا 50)
                createPanel(w + 20, countertopT, d + 50, 0, h/2 + (countertopT/2), 25, matCounter);
            }

            if (drawerCount === 0) {
                let doorW = isSingle ? (w - 3) : ((w / 2) - 1.5);
                let doorH = bodyH - 3;
                if(isSingle) {
                    const singleDoor = createPanel(doorW, doorH, t, 0, yOffset, halfD + (t/2), matFront); singleDoor.rotation.y = -0.4;
                } else {
                    const left = createPanel(doorW, doorH, t, -doorW/2, yOffset, halfD + (t/2), matFront); left.rotation.y = -0.4; 
                    const right = createPanel(doorW, doorH, t, doorW/2, yOffset, halfD + (t/2), matFront); right.rotation.y = 0.4;
                }
            } else {
                const gap = 3; const frontH = (bodyH - ((drawerCount + 1) * gap)) / drawerCount;
                const startFrontY = endY - gap - frontH/2;
                for(let i=0; i<drawerCount; i++) {
                    createPanel(w, frontH, t, 0, startFrontY - i * (frontH + gap), halfD + (t/2) + 10, matFront); 
                }
            }
        }

        // ==========================================
        // ۴. چیدمان ورق (محاسبات میلی‌متری)
        // ==========================================
        function calculateNesting(list) {
            const sheetW = 1830, sheetH = 3660; // ابعاد ورق به میلی‌متر
            let sheets = []; let pieces = [];
            list.forEach(item => { if (item.type === 'wood') { for(let i=0; i<item.Q; i++) pieces.push({ name: item.name, w: item.W, h: item.L, area: item.W * item.L }); } });
            pieces.sort((a, b) => b.area - a.area);
            let currentSheet = { pieces: [], usedArea: 0, currentX: 0, currentY: 0, rowHeight: 0 };
            
            pieces.forEach(p => {
                let pieceW = p.w; let pieceH = p.h;
                if (pieceW > sheetW && pieceH <= sheetW) { pieceW = p.h; pieceH = p.w; } 
                if (currentSheet.currentX + pieceW <= sheetW && currentSheet.currentY + pieceH <= sheetH) {
                    currentSheet.pieces.push({ ...p, x: currentSheet.currentX, y: currentSheet.currentY, drawW: pieceW, drawH: pieceH });
                    currentSheet.currentX += pieceW; currentSheet.rowHeight = Math.max(currentSheet.rowHeight, pieceH); currentSheet.usedArea += (pieceW * pieceH);
                } else if (currentSheet.currentY + currentSheet.rowHeight + pieceH <= sheetH && pieceW <= sheetW) {
                    currentSheet.currentX = 0; currentSheet.currentY += currentSheet.rowHeight; currentSheet.rowHeight = 0;
                    currentSheet.pieces.push({ ...p, x: currentSheet.currentX, y: currentSheet.currentY, drawW: pieceW, drawH: pieceH });
                    currentSheet.currentX += pieceW; currentSheet.rowHeight = Math.max(currentSheet.rowHeight, pieceH); currentSheet.usedArea += (pieceW * pieceH);
                } else {
                    sheets.push(currentSheet); currentSheet = { pieces: [], usedArea: 0, currentX: 0, currentY: 0, rowHeight: 0 };
                    let newW = p.w; let newH = p.h; if (newW > sheetW && newH <= sheetW) { newW = p.h; newH = p.w; }
                    currentSheet.pieces.push({ ...p, x: 0, y: 0, drawW: newW, drawH: newH });
                    currentSheet.currentX = newW; currentSheet.rowHeight = newH; currentSheet.usedArea += (newW * newH);
                }
            });
            if (currentSheet.pieces.length > 0) sheets.push(currentSheet);
            globalSheetsCount = sheets.length; return sheets;
        }

        function drawNesting(sheets) {
            const canvas = document.getElementById('nesting-canvas'); const ctx = canvas.getContext('2d'); const container = document.getElementById('tab-nesting');
            canvas.width = container.clientWidth; canvas.height = container.clientHeight; ctx.clearRect(0, 0, canvas.width, canvas.height);
            const sheetW = 1830, sheetH = 3660; const padding = 20; const totalWidth = canvas.width;
            const maxCols = Math.max(1, Math.floor(totalWidth / (sheetW / 10 + padding))); // مقیاس 1/10 برای نمایش
            const scale = Math.min((totalWidth / maxCols - padding) / (sheetW/10), (canvas.height - padding*2) / (sheetH/10));
            
            sheets.forEach((sheet, index) => {
                const col = index % maxCols; const row = Math.floor(index / maxCols);
                const offsetX = totalWidth - (col * ((sheetW/10) * scale + padding)) - ((sheetW/10) * scale) - padding; 
                const offsetY = row * ((sheetH/10) * scale + padding) + padding;
                
                ctx.fillStyle = "#2a2a35"; ctx.strokeStyle = "#555"; ctx.lineWidth = 2; 
                ctx.fillRect(offsetX, offsetY, (sheetW/10) * scale, (sheetH/10) * scale); 
                ctx.strokeRect(offsetX, offsetY, (sheetW/10) * scale, (sheetH/10) * scale);
                
                sheet.pieces.forEach(p => {
                    ctx.fillStyle = "rgba(0, 210, 255, 0.2)"; ctx.strokeStyle = "#00d2ff"; ctx.lineWidth = 1;
                    const px = offsetX + ((sheetW/10) - (p.x/10) - (p.drawW/10)) * scale; 
                    const py = offsetY + (p.y/10) * scale;
                    ctx.fillRect(px, py, (p.drawW/10) * scale, (p.drawH/10) * scale); 
                    ctx.strokeRect(px, py, (p.drawW/10) * scale, (p.drawH/10) * scale);
                });
            });
            let totalSheetArea = sheets.length * (sheetW * sheetH); let totalUsedArea = sheets.reduce((sum, s) => sum + s.usedArea, 0);
            let wastePercent = totalSheetArea > 0 ? (1 - (totalUsedArea / totalSheetArea)) * 100 : 0;
            document.getElementById('nesting-info').innerHTML = `<div style="color:#00d2ff; font-weight:bold; margin-bottom:5px;">آمار ورق</div>تعداد: <b>${sheets.length}</b> عدد (1830x3660)<br>پرتی: <b style="color:${wastePercent > 30 ? '#e74c3c' : '#27ae60'}">${wastePercent.toFixed(1)}%</b>`;
        }

        function updateUI() {
            const tbody = document.getElementById("cut-list-body"); tbody.innerHTML = "";
            globalCutList.forEach(item => { tbody.innerHTML += `<tr><td style="text-align:right;">${item.name}</td><td>${item.L.toFixed(0)}</td><td>${item.W.toFixed(0)}</td><td>${item.Q}</td></tr>`; });
            document.getElementById('stat-hinges').textContent = globalHardware.hinges;
            document.getElementById('stat-slides').textContent = globalHardware.slides;
            document.getElementById('stat-handles').textContent = globalHardware.handles;
            document.getElementById('stat-edge').textContent = globalHardware.edgeMeters + " متر";
            document.getElementById('stat-sheets').textContent = globalSheetsCount;
            updateFinance();
        }

        function updateFinance() {
            const pMdf = parseFloat(document.getElementById('priceMdf').value) || 0; const pPvc = parseFloat(document.getElementById('pricePvc').value) || 0;
            const pHinge = parseFloat(document.getElementById('priceHinge').value) || 0; const pSlide = parseFloat(document.getElementById('priceSlide').value) || 0; const pHandle = parseFloat(document.getElementById('priceHandle').value) || 0;
            let total = (globalSheetsCount * pMdf) + (parseFloat(globalHardware.edgeMeters) * pPvc) + (globalHardware.hinges * pHinge) + (globalHardware.slides * pSlide) + (globalHardware.handles * pHandle);
            document.getElementById('total-cost-value').textContent = total.toLocaleString('fa-IR');
        }

        // ==========================================
        // ۵. اجرا
        // ==========================================
        function generateAll() {
            const type = document.getElementById('cabinetType').value;
            const w = parseFloat(document.getElementById('width').value); const h = parseFloat(document.getElementById('height').value);
            const d = parseFloat(document.getElementById('depth').value); const t = parseFloat(document.getElementById('thickness').value);
            const drawerCount = parseInt(document.getElementById('drawerCount').value);

            globalCutList = calculateCutList(w, h, d, t, drawerCount, type);
            globalHardware = calculateHardware(drawerCount, type);
            
            build3DCabinet(w, h, d, t, drawerCount, type);
            buildDimensions(w, h, d);
            
            const sheets = calculateNesting(globalCutList);
            drawNesting(sheets);
            updateUI(); 
        }

        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if(event) event.target.classList.add('active');
            if (tabId === 'nesting' || tabId === 'finance') generateAll(); 
        }

        window.onload = () => { init3D(); generateAll(); };
        window.onresize = () => {
            const container = document.getElementById('canvas-container');
            if (camera && renderer && labelRenderer) { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); labelRenderer.setSize(container.clientWidth, container.clientHeight); }
            generateAll();
        };
    </script>
</body>
</html>
